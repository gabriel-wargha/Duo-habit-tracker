# Lints, builds and deploys the React frontend to Azure Static Web Apps.
#
# Runs on every push to main that changes the frontend (and by hand from the GitHub "Actions" tab).
#
# Needs, in GitHub → Settings → Secrets and variables → Actions:
#   secret   AZURE_STATIC_WEB_APPS_API_TOKEN  the Static Web App's deployment token
#   variable VITE_API_URL                     the API's address, e.g. https://habit-tracker-api.azurewebsites.net
name: Frontend

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend.yml'
  workflow_dispatch:

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm # reuse downloaded packages between runs, so installs are faster
          cache-dependency-path: frontend/package-lock.json

      # npm ci = install exactly what package-lock.json says (unlike npm install, it never updates it).
      - name: Install packages
        run: npm ci

      - name: Lint
        run: npm run lint

      # Type-checks (tsc) and builds into frontend/dist. VITE_API_URL is baked into the JavaScript here.
      - name: Build
        run: npm run build
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}

      # We built it ourselves above, so the Azure action only uploads the dist folder.
      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: frontend/dist
          skip_app_build: true
          skip_api_build: true
