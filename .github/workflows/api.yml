# Builds, tests and deploys the .NET API to Azure App Service.
#
# Runs on every push to main that changes the backend (and can be started by hand from the
# GitHub "Actions" tab). If a test fails, nothing is deployed: the live site keeps the last good version.
#
# Needs, in GitHub → Settings → Secrets and variables → Actions:
#   secret   AZURE_WEBAPP_PUBLISH_PROFILE  the App Service's publish profile (an XML file's contents)
#   variable AZURE_WEBAPP_NAME             the App Service's name, e.g. habit-tracker-api
name: API

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'global.json'
      - '.github/workflows/api.yml'
  workflow_dispatch: # the "Run workflow" button

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest # a fresh Linux machine from GitHub, thrown away after the run
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Install the .NET SDK (the version pinned in global.json)
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Run the tests
        run: dotnet test backend/HabitTracker.slnx --configuration Release

      # "publish" = compile in Release mode and gather everything the app needs to run into one folder.
      # That folder is the build artifact we upload.
      - name: Publish
        run: dotnet publish backend/src/HabitTracker.Api --configuration Release --output publish

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: publish
